[project]
name = "nsjail-server"
version = "0.1.0"
description = "A secure code execution server using nsjail for sandboxing."
authors = [{ name = "SEEK Dev Team", email = "seek-admin@study.iitm.ac.in" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask>=3.1.0,<4.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "protobuf>=5.29.3,<6.0.0",
    "six>=1.17.0,<2.0.0",
    "werkzeug>=3.1.3,<4.0.0",
    "subprocess32>=3.5.4,<4.0.0",
    "flask-restful>=0.3.10,<1.0.0",
]

[dependency-groups]
dev = [
    "grpcio>=1.71.0,<2.0.0",
    "grpcio-tools>=1.71.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
    "coverage>=7.8.0,<8.0.0",
    "debugpy>=1.8.14,<2.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "locust>=2.20.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = [
    "src/proto",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle (no docstring enforcement)
    "S101",   # assert_used (useful in tests)
    "COM812", # trailing commas (conflicts with ruff formatter)
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Run tests sequentially to avoid race conditions
addopts = "--tb=short --strict-markers -v"
markers = [
    "integration: marks tests as integration tests"
]
