services:
  web:
    platform: linux/amd64
    build: .
    privileged: true
    restart: always
    command: uv run python -m nsjps_flask.wsgi
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  integration-tests:
    platform: linux/amd64
    build: .
    working_dir: /app/src
    privileged: true  # Required for nsjail namespace operations
    command: uv run pytest tests/integration/test_integration.py -v
    volumes:
      - .:/app
    profiles:
      - testing