nsjail_path: "{{ HOME }}/nsjail/nsjail"
default_common_settings {
  nsjail_args: "-B /bin -B /usr -B /lib -B /lib64 -B /dev -B /etc -B /var -R /virtualenvs -R /db_backups"
}
language_settings {
  language: "c"
  filename: "test.c"
  compilation_options {
    path: "/usr/bin/gcc"
    args: "{{ EXTRA_ARGS }} -o a.out {{ FILENAME }}"
    resource_limits {
      time_limit: 3
      process_limit: 100
      memory_limit: 10240
    }
  }
  runtime_options {
    path: "a.out"
    args: ""
    resource_limits {
      time_limit: 3
      process_limit: 0
      memory_limit: 1024
    }
  }
}
language_settings {
  language: "cpp"
  filename: "test.cpp"
  compilation_options {
    path: "/usr/bin/g++"
    args: "{{ EXTRA_ARGS }} -o a.out {{ FILENAME }}"
    resource_limits {
      time_limit: 3
      process_limit: 100
      memory_limit: 10240
    }
  }
  runtime_options {
    path: "a.out"
    args: ""
    resource_limits {
      time_limit: 3
      process_limit: 0
      memory_limit: 1024
    }
  }
}
language_settings {
  language: "java"
  filename: "TAKE_FROM_REQUEST"
  binary_filename: "TAKE_FROM_REQUEST"
  compilation_options {
    path: "/usr/lib/jvm/java-17-openjdk-amd64/bin/javac"
    args: "{{ EXTRA_ARGS }} {{ FILENAME }}"
    resource_limits {
      time_limit: 6
      process_limit: 100
      memory_limit: 102400
    }
  }
  runtime_options {
    path: "/usr/lib/jvm/java-17-openjdk-amd64/bin/java"
    args: "{{ BINARY_FILENAME }}"
    resource_limits {
      time_limit: 6
      process_limit: 100
      memory_limit: 102400
    }
  }
}
language_settings {
  language: "py"
  filename: "test.py"
  runtime_options {
    path: "/usr/local/bin/python2.7"
    args: "{{ FILENAME }}"
    resource_limits {
      time_limit: 9
      process_limit: 100
      memory_limit: 102400
    }
  }
}
