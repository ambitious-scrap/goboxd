server:
  port: 8080
  jail_base: /tmp/goboxd
  nsjail_path: /usr/local/bin/nsjail
  output_cap_bytes: 65536
  # seccomp-bpf syscall filtering: off | audit | enforce.
  # off     = no filter (default). audit = load each language's seccomp_policy
  # and add --seccomp_log (observe, don't kill — pair with a permissive policy
  # default). enforce = apply the policy as written. A language without a
  # seccomp_policy is never filtered. See docs/security.md.
  seccomp_mode: "off"

languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
    smoke:
      cmd: /usr/bin/python3
      args: ["--version"]

  - id: c
    name: C
    source_filename: solution.c
    artifact: a.out
    build:
      cmd: /usr/bin/gcc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
        - "-g"
        - "-lm"
    run:
      cmd: ./{{artifact}}
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
    smoke:
      cmd: /usr/bin/gcc
      args: ["--version"]

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: a.out
    build:
      cmd: /usr/bin/g++
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
        - "-g"
    run:
      cmd: ./{{artifact}}
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
    smoke:
      cmd: /usr/bin/g++
      args: ["--version"]

  - id: java
    name: Java
    source_filename: "{{source_filename}}"
    artifact: "{{artifact_filename}}"
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    build:
      cmd: /usr/bin/javac
      args: ["{{flags}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 524288
        max_processes: 100
      flag_allowlist:
        - "-Xlint"
        - "-Xlint:*"
        - "-encoding"
        - "UTF-8"
    run:
      cmd: /usr/bin/java
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 10
        memory_kb: 524288
        max_processes: 300
    smoke:
      cmd: /usr/bin/java
      args: ["--version"]

  - id: bash
    name: Bash
    source_filename: solution.sh
    run:
      cmd: /bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
    smoke:
      cmd: /bin/bash
      args: ["--version"]

  - id: javascript
    name: JavaScript (Node)
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 262144
        max_processes: 100
    smoke:
      cmd: /usr/bin/node
      args: ["--version"]

  - id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: a.out
    build:
      cmd: /usr/bin/iverilog
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 102400
        max_processes: 100
      flag_allowlist:
        - "-g2012"
        - "-Wall"
    run:
      # iverilog emits a vvp bytecode program, not a native executable; it is run
      # by the vvp runtime, not invoked directly.
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 64
    smoke:
      cmd: /usr/bin/iverilog
      args: ["-V"]
