server:
  port: 8080
  # Prometheus /metrics admin port, served separately from the public API so
  # submitters can't scrape internal detail. Default 9090; set <=0 to disable.
  metrics_port: 9090
  jail_base: /tmp/goboxd
  nsjail_path: /usr/local/bin/nsjail
  output_cap_bytes: 65536
  # Admission control (C-1). max_queue bounds requests waiting beyond the running
  # set: when in-system requests exceed max_concurrency + max_queue, /run sheds
  # load with 503 + Retry-After rather than parking unbounded goroutines. This is
  # pure traffic control — it never mutates per-run limits, so verdicts stay
  # load-independent. Default: 2 * max_concurrency.
  # max_queue: 0
  # max_build_concurrency caps concurrent compile steps below max_concurrency, so
  # a flood of heavy compiles can't starve light interpreted runs. 0 or a value
  # >= max_concurrency disables the separate lane. Default: max(1, max_concurrency/2).
  # max_build_concurrency: 0
  # fast_lane_reserved reserves this many of the max_concurrency run slots for
  # light (interpreted, no build step) jobs, so a burst of slow compiled jobs
  # can never starve them of admission. Heavy compiled jobs are capped at
  # max_concurrency - fast_lane_reserved. Pure admission ordering — verdicts stay
  # load-independent. 0 disables. Default: max(1, max_concurrency/4), clamped so
  # heavy jobs keep >= 1 slot.
  # fast_lane_reserved: 0
  # Artifact cache (C-2): reuse the compiled output of identical submissions
  # (same source + flags + toolchain version). Verdict-neutral — only the build
  # step is reused; the run phase still executes live per test. The key includes
  # the toolchain version, so a compiler bump never serves a stale binary.
  cache_enabled: true
  cache_dir: /tmp/goboxd-cache
  cache_max_entries: 512
  # seccomp-bpf syscall filtering: off | audit | enforce.
  # enforce = apply each language's seccomp_policy as written (default; a denied
  # syscall delivers SIGSYS -> runtime_error). audit = also add --seccomp_log so
  # violations are logged. off = no filter. A language without a seccomp_policy is
  # never filtered. The shared &deny_seccomp anchor (below) is a DEFAULT ALLOW
  # deny-list killing the kernel escape surface. See docs/security.md §8.
  seccomp_mode: "enforce"

languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    # Shared deny-list seccomp-bpf filter (kafel). DEFAULT ALLOW keeps JIT/threaded
    # runtimes (JVM, V8, CPython) working; only the kernel sandbox-escape surface is
    # killed. clone3 returns ENOSYS so glibc falls back to clone() for pthreads
    # (same technique as Docker's default profile). Anchored here, aliased by every
    # other language so the policy is defined once.
    seccomp_policy: &deny_seccomp |
      POLICY goboxd {
        KILL {
          ptrace, mount, pivot_root, chroot, setns, unshare,
          keyctl, add_key, request_key, bpf, perf_event_open,
          init_module, finit_module, delete_module,
          kexec_load, reboot, swapon, swapoff,
          process_vm_readv, process_vm_writev
        }
      }
      USE goboxd DEFAULT ALLOW
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
    smoke:
      cmd: /usr/bin/python3
      args: ["--version"]

  - id: c
    name: C
    source_filename: solution.c
    seccomp_policy: *deny_seccomp
    artifact: a.out
    build:
      cmd: /usr/bin/gcc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
        - "--std=*"
        - "-g"
        - "-lm"
    run:
      cmd: ./{{artifact}}
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
    smoke:
      cmd: /usr/bin/gcc
      args: ["--version"]

  - id: cpp
    name: C++
    source_filename: solution.cpp
    seccomp_policy: *deny_seccomp
    artifact: a.out
    build:
      cmd: /usr/bin/g++
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
        - "--std=*"
        - "-g"
    run:
      cmd: ./{{artifact}}
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
    smoke:
      cmd: /usr/bin/g++
      args: ["--version"]

  - id: java
    name: Java
    source_filename: "{{source_filename}}"
    seccomp_policy: *deny_seccomp
    artifact: "{{artifact_filename}}"
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    build:
      cmd: /usr/bin/javac
      # -J-XX:ActiveProcessorCount=1 runs the compiler JVM single-threaded so a
      # build does not spin up GOMAXPROCS-many GC/JIT threads on the shared 2 vCPU.
      args: ["-J-XX:ActiveProcessorCount=1", "{{flags}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 524288
        max_processes: 100
      flag_allowlist:
        - "-Xlint"
        - "-Xlint:*"
        - "-encoding"
        - "UTF-8"
    run:
      cmd: /usr/bin/java
      # Container-aware JVM tuning, passed as argv (NOT JAVA_TOOL_OPTIONS, which
      # prints a "Picked up ..." banner to stderr and would pollute output diffs):
      #   UseSerialGC            — single-threaded GC; parallel/G1 GC threads are
      #                            pure overhead on a sub-core run that lives ~1s.
      #   ActiveProcessorCount=1 — stop the JVM sizing thread pools to host cores.
      #   MaxRAMPercentage=70    — cap heap at 70% of the per-run cgroup memory
      #                            limit so the JVM stays inside its memory_kb.
      args: ["-XX:+UseSerialGC", "-XX:ActiveProcessorCount=1", "-XX:MaxRAMPercentage=70", "{{artifact}}"]
      limits:
        wall_time_s: 10
        memory_kb: 524288
        max_processes: 300
    smoke:
      cmd: /usr/bin/java
      args: ["--version"]

  - id: bash
    name: Bash
    source_filename: solution.sh
    seccomp_policy: *deny_seccomp
    run:
      cmd: /bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
    smoke:
      cmd: /bin/bash
      args: ["--version"]

  - id: javascript
    name: JavaScript (Node)
    source_filename: solution.js
    seccomp_policy: *deny_seccomp
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 262144
        max_processes: 100
    smoke:
      cmd: /usr/bin/node
      args: ["--version"]

  - id: verilog
    name: Verilog
    source_filename: solution.v
    seccomp_policy: *deny_seccomp
    artifact: a.out
    build:
      cmd: /usr/bin/iverilog
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 102400
        max_processes: 100
      flag_allowlist:
        - "-g2012"
        - "-Wall"
    run:
      # iverilog emits a vvp bytecode program, not a native executable; it is run
      # by the vvp runtime, not invoked directly.
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 64
    smoke:
      cmd: /usr/bin/iverilog
      args: ["-V"]

  - id: rust
    name: Rust
    source_filename: solution.rs
    artifact: solution
    build:
      cmd: /usr/bin/rustc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 30
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O"
        - "--edition"
        - "--edition=*"
        - "-C"
        - "opt-level=*"
    run:
      cmd: ./{{artifact}}
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
    smoke:
      cmd: /usr/bin/rustc
      args: ["--version"]

  - id: elixir
    name: Elixir
    source_filename: solution.exs
    run:
      # Elixir runs on the BEAM VM: it spawns a scheduler thread per core and
      # reserves a large virtual address space, so it needs generous process and
      # memory limits and relies on cgroup memory.max (RSS) rather than RLIMIT_AS.
      cmd: /usr/bin/elixir
      args: ["{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 524288
        max_processes: 300
    smoke:
      cmd: /usr/bin/elixir
      args: ["--version"]

  - id: powershell
    name: PowerShell
    source_filename: solution.ps1
    run:
      cmd: /usr/bin/env
      args: ["DOTNET_GCHeapHardLimit=10000000", "/usr/bin/pwsh", "-NoProfile", "-NonInteractive", "-File", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 524288
        max_processes: 200
    smoke:
      cmd: /usr/bin/pwsh
      args: ["-NoProfile", "-Command", "$PSVersionTable.PSVersion.ToString()"]
